<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WPS BOM 一键导入</title>
  <style>
    :root {
      --primary: #1e40af;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e3a8a;
      --text-2: #475569;
      --border: #dbeafe;
      --error: #dc2626;
      --ok: #15803d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px; padding: 8px;
      background: var(--bg); color: var(--text);
      font: 13px "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    .hidden { display: none !important; }
    .dim { color: var(--text-2); }
    .section {
      margin-bottom: 8px; padding: 8px;
      background: var(--card); border: 1px solid var(--border); border-radius: 4px;
    }
    .section h2 {
      margin-bottom: 6px; color: var(--text-2); font-size: 13px;
    }
    .section h2 span { font-weight: 400; }
    .section-title-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 6px;
    }
    .section-title-row h2 { margin-bottom: 0; }
    .text-button {
      padding: 2px 6px; border: 0; border-radius: 3px;
      background: transparent; color: var(--primary);
      font-size: 11px; cursor: pointer;
    }
    .text-button:hover { background: #eff6ff; }

    #error-summary {
      margin-bottom: 8px; padding: 6px 8px;
      border: 1px solid var(--error); border-radius: 4px;
      background: #fef2f2; color: var(--error); font-size: 12px;
    }
    #error-summary ul { padding-left: 16px; }

    #sheet-info {
      display: grid; grid-template-columns: 64px 1fr;
      gap: 4px 8px; font-size: 12px;
    }
    #sheet-info .label { color: var(--text-2); }
    #sheet-info .value { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }

    select, input {
      width: 100%; padding: 5px;
      border: 1px solid var(--border); border-radius: 3px;
      background: #fff; color: var(--text); font-size: 13px;
    }
    input:focus, select:focus {
      border-color: var(--primary);
      outline: 1px solid var(--primary);
    }
    .inline-row {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px;
    }
    .mold-combobox {
      position: relative;
    }
    .mold-combobox input {
      padding-right: 30px;
    }
    .mold-dropdown-toggle {
      position: absolute; top: 1px; right: 1px; bottom: 1px;
      width: 28px; padding: 0;
      border: 0; border-left: 1px solid var(--border);
      background: #fff; color: var(--text-2);
      font-size: 10px; cursor: pointer;
    }
    .mold-dropdown-toggle:disabled { color: #cbd5e1; cursor: not-allowed; }
    .mold-results {
      position: absolute; top: calc(100% + 2px); left: 0; right: 0; z-index: 12;
      max-height: 220px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 4px;
      background: #fff; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.14);
    }
    .mold-result-item {
      padding: 6px 8px; border-bottom: 1px solid #f1f5f9;
      color: var(--text); font-size: 12px; cursor: pointer;
    }
    .mold-result-item:last-child { border-bottom: 0; }
    .mold-result-item.active, .mold-result-item:hover { background: #eff6ff; }
    .mold-result-no { display: block; font-weight: 600; }
    .mold-result-name { display: block; margin-top: 2px; color: var(--text-2); font-size: 11px; }
    .mold-result-state {
      padding: 8px; color: var(--text-2); font-size: 11px; text-align: center;
    }
    button.secondary {
      padding: 5px 9px;
      border: 1px solid var(--border); border-radius: 3px;
      background: #fff; color: var(--primary); font-size: 12px; cursor: pointer;
    }
    button.secondary:disabled { color: #94a3b8; cursor: not-allowed; }
    button.primary {
      width: 100%; padding: 8px;
      border: 0; border-radius: 4px;
      background: var(--primary); color: #fff; font-size: 13px; cursor: pointer;
    }
    button.primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .field-label {
      display: block; margin: 6px 0 3px;
      color: var(--text-2); font-size: 11px;
    }
    details.section > summary {
      color: var(--text-2); font-size: 13px; font-weight: 600; cursor: pointer;
    }
    details.section > summary span { float: right; font-weight: 400; }
    details.section[open] > summary { margin-bottom: 6px; }

    .header-row-control {
      display: grid; grid-template-columns: auto 72px auto;
      align-items: center; gap: 5px; margin-bottom: 6px;
    }
    .header-row-control label { color: var(--text-2); font-size: 11px; }
    .header-row-control input { padding: 4px 5px; }

    #mapping-list {
      max-height: 300px; overflow: auto;
      border-top: 1px solid var(--border);
    }
    .mapping-row {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      align-items: center; gap: 8px; padding: 5px 0;
      border-bottom: 1px dashed #e2e8f0; font-size: 11px;
    }
    .mapping-row.unmatched { background: #fef2f2; }
    .mapping-target { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
    .mapping-target .group { color: var(--text-2); }
    .mapping-row.unmatched .mapping-target { color: var(--error); }
    .mapping-select { min-width: 0; padding: 4px 5px; font-size: 11px; }
    .mapping-static {
      min-width: 0; padding: 4px 5px; color: var(--text-2);
      background: #f8fafc; border: 1px solid var(--border); border-radius: 3px;
      font-size: 11px;
    }
    .mapping-hint, .action-hint {
      margin-top: 5px; color: var(--text-2); font-size: 10px;
    }
    .existing-parts {
      max-height: 130px; margin-top: 5px; overflow: auto;
      border-top: 1px dashed #e2e8f0;
    }
    .existing-part-item {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 6px; padding: 4px 0;
      border-bottom: 1px solid #f1f5f9; font-size: 11px;
    }
    .existing-part-item span {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .existing-part-item .part-no { font-weight: 600; }
    .existing-part-more {
      padding-top: 4px; color: var(--text-2); font-size: 10px;
    }

    #preview-panel { overflow-x: auto; }
    .preview-summary { margin-bottom: 4px; color: var(--text-2); font-size: 11px; }
    table.preview { border-collapse: collapse; width: 100%; font-size: 12px; }
    table.preview th, table.preview td {
      max-width: 90px; padding: 3px 5px;
      border: 1px solid #e2e8f0; text-align: left;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    table.preview th {
      background: #f1f5f9; color: var(--text-2); font-weight: 600;
    }
    table.preview td.row-no {
      width: 24px; background: #f1f5f9;
      color: var(--text-2); text-align: center;
    }
    .type-summary { margin-top: 4px; color: var(--text-2); font-size: 10px; }

    #toast {
      position: fixed; left: 50%; bottom: 16px; z-index: 10;
      padding: 6px 12px; border-radius: 4px;
      background: #0f172a; color: #fff; font-size: 12px;
      opacity: 0; pointer-events: none; transform: translateX(-50%);
      transition: opacity 150ms;
    }
    #toast.show { opacity: 0.95; }

    #validation-status {
      margin: 0 0 6px; padding: 6px;
      border-radius: 3px; background: #f1f5f9;
      color: var(--text-2); font-size: 11px; white-space: pre-wrap;
    }
    #validation-status.ok { background: #f0fdf4; color: var(--ok); }
    #validation-status.warn { background: #fffbeb; color: #b45309; }
    #validation-status.error { background: #fef2f2; color: var(--error); }
    #generate-status {
      margin: 6px 0; padding: 6px;
      border-radius: 3px; background: #f1f5f9;
      color: var(--text-2); font-size: 11px; white-space: pre-wrap;
    }
    #generate-status.ok { background: #f0fdf4; color: var(--ok); }
    #generate-status.warn { background: #fffbeb; color: #b45309; }
    #generate-status.error { background: #fef2f2; color: var(--error); }
    .generated-preview {
      margin: 6px 0; border-top: 1px dashed #e2e8f0;
    }
    .generated-preview-title {
      margin: 5px 0; color: var(--text-2); font-size: 11px;
    }
    .generated-preview-scroll {
      max-height: 180px; overflow: auto;
    }
    table.generated-table {
      width: max-content; min-width: 100%; border-collapse: collapse; font-size: 10px;
    }
    table.generated-table th, table.generated-table td {
      max-width: 110px; padding: 3px 5px;
      border: 1px solid #e2e8f0; text-align: left;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    table.generated-table th { background: #f1f5f9; color: var(--text-2); }
    table.generated-table td.row-no {
      position: sticky; left: 0; background: #f8fafc;
      color: var(--text-2); text-align: center;
    }
    #import-status {
      margin: 6px 0; padding: 6px;
      border-radius: 3px; background: #f1f5f9;
      color: var(--text-2); font-size: 11px; white-space: pre-wrap;
    }
    #import-status.ok { background: #f0fdf4; color: var(--ok); }
    #import-status.warn { background: #fffbeb; color: #b45309; }
    #import-status.error { background: #fef2f2; color: var(--error); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="error-summary" class="hidden" tabindex="-1"></div>

  <!-- 当前工作表只读信息 -->
  <section class="section">
    <div class="section-title-row">
      <h2>当前工作表</h2>
      <button class="text-button" id="btn-reload-page" type="button" title="重新加载最新插件代码">刷新</button>
    </div>
    <div id="sheet-info" class="dim">正在读取工作表信息...</div>
  </section>

  <!-- 登录模块完成前，开发测试使用本机保存的平台令牌 -->
  <details class="section" id="connection-panel" open>
    <summary>开发登录 <span id="connection-status" class="dim">未配置</span></summary>
    <label class="field-label" for="dev-token">平台访问令牌</label>
    <input id="dev-token" type="password" autocomplete="off" placeholder="粘贴 Authorization 中的令牌" />
    <div id="connection-hint" class="action-hint">令牌只保存在当前浏览器本地</div>
    <div style="margin-top:6px">
      <button class="secondary" id="btn-save-token" type="button">保存令牌</button>
    </div>
  </details>

  <!-- 源表头 -->
  <section class="section">
    <h2>源表头</h2>
    <div class="header-row-control">
      <label for="source-header-row">表头行</label>
      <input id="source-header-row" type="number" min="1" step="1" />
      <button class="secondary" id="btn-apply-header-row" type="button">读取</button>
    </div>
  </section>

  <!-- 初版只保留一个 BOM 模板入口 -->
  <section class="section">
    <h2>BOM 模板 <span id="env-tag" class="dim"></span></h2>
    <select id="tpl-select" aria-label="选择 BOM 模板"></select>
    <div id="tpl-hint" class="dim" style="margin-top:4px;font-size:11px"></div>
  </section>

  <!-- 目标模具：先按编号或名称查询，再选择这一批零件要导入的模具 -->
  <section class="section">
    <h2>目标模具</h2>
    <div class="mold-combobox" id="mold-combobox">
      <input
        id="mold-keyword"
        type="text"
        autocomplete="off"
        role="combobox"
        aria-autocomplete="list"
        aria-expanded="false"
        aria-controls="mold-results"
        placeholder="输入模具编号或名称"
      />
      <button class="mold-dropdown-toggle" id="btn-toggle-molds" type="button" aria-label="展开模具列表">▼</button>
      <div class="mold-results hidden" id="mold-results" role="listbox"></div>
    </div>
    <div id="mold-part-status" class="action-hint">选择模具后读取已有零件数量</div>
    <div id="existing-parts-preview" class="existing-parts hidden"></div>
  </section>

  <!-- 自动表头匹配结果 -->
  <section class="section hidden" id="mapping-section">
    <h2>字段映射 <span id="mapping-stats" class="dim"></span></h2>
    <div id="mapping-list"></div>
    <div id="mapping-hint" class="mapping-hint"></div>
    <button class="secondary" id="btn-auto-map" type="button" style="width:100%;margin-top:6px">重新按表头名称自动匹配</button>
  </section>

  <!-- 前 20 行数据预览 -->
  <section class="section">
    <h2>BOM 数据预览 <span id="preview-stats" class="dim"></span></h2>
    <div id="preview-panel" class="dim">正在读取数据...</div>
  </section>

  <!-- 当前步骤只验证目标模具，一键上传在后续步骤接入 -->
  <section class="section">
    <button class="secondary" id="btn-validate-bom" type="button" disabled style="width:100%">检查完整 BOM</button>
    <div id="validation-status" class="hidden" role="status"></div>
    <button class="secondary" id="btn-generate-xlsx" type="button" disabled style="width:100%;margin-top:6px">生成临时 XLSX（暂不上传）</button>
    <div id="generate-status" class="hidden" role="status"></div>
    <div id="generated-preview" class="generated-preview hidden">
      <div class="generated-preview-title" id="generated-preview-title">临时文件内容预览</div>
      <div class="generated-preview-scroll">
        <table class="generated-table" id="generated-preview-table"></table>
      </div>
      <button class="secondary" id="btn-download-xlsx" type="button" style="width:100%;margin-top:6px">下载临时 XLSX</button>
    </div>
    <button class="primary" id="btn-one-click" disabled>一键导入 BOM</button>
    <div id="import-status" class="hidden" role="status"></div>
    <div id="import-hint" class="action-hint">请先选择模板和目标模具</div>
  </section>

  <div id="toast"></div>

  <script src="js/ribbon.js"></script>
  <script src="js/core.js"></script>
  <script src="js/adapter.js"></script>
  <script src="js/api.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
