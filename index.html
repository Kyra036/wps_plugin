<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WPS BOM 一键导入</title>
  <style>
    :root {
      --primary: #1e40af;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e3a8a;
      --text-2: #475569;
      --border: #dbeafe;
      --error: #dc2626;
      --ok: #15803d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px; padding: 8px;
      background: var(--bg); color: var(--text);
      font: 13px "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    .hidden { display: none !important; }
    .dim { color: var(--text-2); }
    .section {
      margin-bottom: 8px; padding: 8px;
      background: var(--card); border: 1px solid var(--border); border-radius: 4px;
    }
    .section h2 {
      margin-bottom: 6px; color: var(--text-2); font-size: 13px;
    }
    .section h2 span { font-weight: 400; }

    #error-summary {
      margin-bottom: 8px; padding: 6px 8px;
      border: 1px solid var(--error); border-radius: 4px;
      background: #fef2f2; color: var(--error); font-size: 12px;
    }
    #error-summary ul { padding-left: 16px; }

    #sheet-info {
      display: grid; grid-template-columns: 64px 1fr;
      gap: 4px 8px; font-size: 12px;
    }
    #sheet-info .label { color: var(--text-2); }
    #sheet-info .value { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }

    select, input {
      width: 100%; padding: 5px;
      border: 1px solid var(--border); border-radius: 3px;
      background: #fff; color: var(--text); font-size: 13px;
    }
    input:focus, select:focus {
      border-color: var(--primary);
      outline: 1px solid var(--primary);
    }
    .inline-row {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px;
    }
    button.secondary {
      padding: 5px 9px;
      border: 1px solid var(--border); border-radius: 3px;
      background: #fff; color: var(--primary); font-size: 12px; cursor: pointer;
    }
    button.secondary:disabled { color: #94a3b8; cursor: not-allowed; }
    button.primary {
      width: 100%; padding: 8px;
      border: 0; border-radius: 4px;
      background: var(--primary); color: #fff; font-size: 13px; cursor: pointer;
    }
    button.primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .field-label {
      display: block; margin: 6px 0 3px;
      color: var(--text-2); font-size: 11px;
    }
    details.section > summary {
      color: var(--text-2); font-size: 13px; font-weight: 600; cursor: pointer;
    }
    details.section > summary span { float: right; font-weight: 400; }
    details.section[open] > summary { margin-bottom: 6px; }

    #source-headers {
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .header-chip {
      max-width: 100%; padding: 3px 6px;
      border: 1px solid var(--border); border-radius: 3px;
      background: #f8fafc; font-size: 12px; overflow-wrap: anywhere;
    }
    .header-chip .col {
      margin-right: 4px; color: var(--primary);
      font-family: Consolas, monospace;
    }
    .header-chip.empty { color: #94a3b8; }

    #mapping-list {
      max-height: 300px; overflow: auto;
      border-top: 1px solid var(--border);
    }
    .mapping-row {
      display: grid; grid-template-columns: minmax(0, 1fr) 14px minmax(0, 1fr);
      align-items: center; gap: 4px; padding: 5px 0;
      border-bottom: 1px dashed #e2e8f0; font-size: 11px;
    }
    .mapping-row.unmatched { background: #fef2f2; }
    .mapping-source, .mapping-target { min-width: 0; overflow-wrap: anywhere; }
    .mapping-source .col {
      margin-right: 4px; color: var(--primary);
      font-family: Consolas, monospace; font-weight: 600;
    }
    .mapping-target .group { color: var(--text-2); }
    .mapping-arrow { color: var(--text-2); text-align: center; }
    .mapping-row.unmatched .mapping-target { color: var(--error); }
    .mapping-hint, .action-hint {
      margin-top: 5px; color: var(--text-2); font-size: 10px;
    }
    .existing-parts {
      max-height: 130px; margin-top: 5px; overflow: auto;
      border-top: 1px dashed #e2e8f0;
    }
    .existing-part-item {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 6px; padding: 4px 0;
      border-bottom: 1px solid #f1f5f9; font-size: 11px;
    }
    .existing-part-item span {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .existing-part-item .part-no { font-weight: 600; }
    .existing-part-more {
      padding-top: 4px; color: var(--text-2); font-size: 10px;
    }

    #preview-panel { overflow-x: auto; }
    .preview-summary { margin-bottom: 4px; color: var(--text-2); font-size: 11px; }
    table.preview { border-collapse: collapse; width: 100%; font-size: 12px; }
    table.preview th, table.preview td {
      max-width: 90px; padding: 3px 5px;
      border: 1px solid #e2e8f0; text-align: left;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    table.preview th {
      background: #f1f5f9; color: var(--text-2); font-weight: 600;
    }
    table.preview td.row-no {
      width: 24px; background: #f1f5f9;
      color: var(--text-2); text-align: center;
    }
    .type-summary { margin-top: 4px; color: var(--text-2); font-size: 10px; }

    #toast {
      position: fixed; left: 50%; bottom: 16px; z-index: 10;
      padding: 6px 12px; border-radius: 4px;
      background: #0f172a; color: #fff; font-size: 12px;
      opacity: 0; pointer-events: none; transform: translateX(-50%);
      transition: opacity 150ms;
    }
    #toast.show { opacity: 0.95; }

    #validation-status {
      margin: 0 0 6px; padding: 6px;
      border-radius: 3px; background: #f1f5f9;
      color: var(--text-2); font-size: 11px; white-space: pre-wrap;
    }
    #validation-status.ok { background: #f0fdf4; color: var(--ok); }
    #validation-status.error { background: #fef2f2; color: var(--error); }
    #duplicate-status {
      margin: 6px 0; padding: 6px;
      border-radius: 3px; background: #f1f5f9;
      color: var(--text-2); font-size: 11px; white-space: pre-wrap;
    }
    #duplicate-status.ok { background: #f0fdf4; color: var(--ok); }
    #duplicate-status.warning { background: #fffbeb; color: #b45309; }
    #duplicate-status.error { background: #fef2f2; color: var(--error); }
    .duplicate-preview {
      max-height: 150px; margin-bottom: 6px; overflow: auto;
      border-top: 1px dashed #e2e8f0;
    }
    .duplicate-item {
      padding: 4px 0; border-bottom: 1px solid #f1f5f9; font-size: 11px;
    }
    .duplicate-item strong { margin-right: 5px; }
    .duplicate-item span { color: var(--text-2); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="error-summary" class="hidden" tabindex="-1"></div>

  <!-- 当前工作表只读信息 -->
  <section class="section">
    <h2>当前工作表</h2>
    <div id="sheet-info" class="dim">正在读取工作表信息...</div>
  </section>

  <!-- 登录模块完成前，开发测试使用本机保存的平台令牌 -->
  <details class="section" id="connection-panel" open>
    <summary>开发登录 <span id="connection-status" class="dim">未配置</span></summary>
    <label class="field-label" for="dev-token">平台访问令牌</label>
    <input id="dev-token" type="password" autocomplete="off" placeholder="粘贴 Authorization 中的令牌" />
    <div id="connection-hint" class="action-hint">令牌只保存在当前浏览器本地</div>
    <div style="margin-top:6px">
      <button class="secondary" id="btn-save-token" type="button">保存令牌</button>
    </div>
  </details>

  <!-- 源表头 -->
  <section class="section">
    <h2>源表头 <span id="header-count" class="dim"></span></h2>
    <div id="source-headers" class="dim">正在读取源表头...</div>
  </section>

  <!-- 初版只保留一个 BOM 模板入口 -->
  <section class="section">
    <h2>BOM 模板 <span id="env-tag" class="dim"></span></h2>
    <select id="tpl-select" aria-label="选择 BOM 模板"></select>
    <div id="tpl-hint" class="dim" style="margin-top:4px;font-size:11px"></div>
  </section>

  <!-- 目标模具：先按编号或名称查询，再选择这一批零件要导入的模具 -->
  <section class="section">
    <h2>目标模具</h2>
    <div class="inline-row">
      <input id="mold-keyword" type="text" autocomplete="off" placeholder="模具编号或名称" />
      <button class="secondary" id="btn-search-mold" type="button">查询</button>
    </div>
    <select id="mold-select" style="margin-top:5px" aria-label="选择目标模具" disabled>
      <option value="">请先查询模具</option>
    </select>
    <div id="mold-part-status" class="action-hint">选择模具后读取已有零件数量</div>
    <div id="existing-parts-preview" class="existing-parts hidden"></div>
  </section>

  <!-- 自动表头匹配结果 -->
  <section class="section hidden" id="mapping-section">
    <h2>字段映射 <span id="mapping-stats" class="dim"></span></h2>
    <div id="mapping-list"></div>
    <div id="mapping-hint" class="mapping-hint"></div>
  </section>

  <!-- 前 20 行数据预览 -->
  <section class="section">
    <h2>BOM 数据预览 <span id="preview-stats" class="dim"></span></h2>
    <div id="preview-panel" class="dim">正在读取数据...</div>
  </section>

  <!-- 当前步骤只验证目标模具，一键上传在后续步骤接入 -->
  <section class="section">
    <button class="secondary" id="btn-validate-bom" type="button" disabled style="width:100%">检查完整 BOM</button>
    <div id="validation-status" class="hidden" role="status"></div>
    <button class="secondary" id="btn-check-duplicates" type="button" disabled style="width:100%;margin-top:6px">检查重复零件</button>
    <div id="duplicate-status" class="hidden" role="status"></div>
    <div id="duplicate-preview" class="duplicate-preview hidden"></div>
    <button class="primary" id="btn-one-click" disabled>一键导入 BOM</button>
    <div id="import-hint" class="action-hint">请先选择模板和目标模具</div>
  </section>

  <div id="toast"></div>

  <script src="js/ribbon.js"></script>
  <script src="js/core.js"></script>
  <script src="js/adapter.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
